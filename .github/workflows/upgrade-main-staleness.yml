name: upgrade-main Staleness Monitor

# DNA-3277: org-level backstop for the projen `upgrade-main` dependency-upgrade
# programme.
#
# Per-repo failure alerting already exists (`alert-on-failure` in the generated
# upgrade-main workflow, @dearhealth/projen >= 4.65.1) and covers runs that FAIL.
# It cannot cover runs that never happen — most importantly GitHub's 60-day
# auto-disable of scheduled workflows in quiet repos (`disabled_inactivity`),
# which produces no run, no failure and therefore no alert.
#
# This job watches the whole org from the meta-repo and keeps exactly one issue
# here (`upgrade-main staleness report`) describing every repo whose last
# SUCCESSFUL upgrade-main run is older than 48h, closing the issue once all
# repos are healthy again.

on:
  schedule:
    # Daily at 08:00 UTC — well after the 00:00 UTC upgrade-main cron in the
    # individual repos, so a run started overnight has finished by now.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      stale_hours:
        description: "Staleness threshold in hours"
        required: false
        default: "48"
      dry_run:
        description: "Scan and report to the run summary without touching the issue"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upgrade-main-staleness
  cancel-in-progress: false

jobs:
  scan:
    name: Scan org for stale upgrade-main workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan and reconcile the staleness report issue
        env:
          # The repo-scoped GITHUB_TOKEN can only read THIS repo's Actions data,
          # so a cross-repo token is required. Fallback chain, first match wins:
          #
          #   ORG_ACTIONS_READ_TOKEN - preferred. Fine-grained PAT (or GitHub App
          #     installation token), resource owner dearhealth, all repositories,
          #     with exactly `Actions: read-only` + `Metadata: read-only` and
          #     nothing else. Issue writes go through REPORT_TOKEN below, so
          #     this token needs no Issues permission. NOT YET PROVISIONED at
          #     the time this workflow was added - see the PR description.
          #   ACCESS_REPO_TOKEN - existing org secret, a classic PAT whose `repo`
          #     scope implies actions:read. Works today, but it is a broad
          #     write-capable token shared with other workflows, so it is only
          #     the interim fallback.
          #   GITHUB_TOKEN - last resort; the scan will find zero upgrade-main
          #     workflows and fail loudly rather than reporting a false all-clear.
          GH_TOKEN: ${{ secrets.ORG_ACTIONS_READ_TOKEN || secrets.ACCESS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          # Issue reads/writes stay on the repo-scoped token, so the PAT above
          # needs only Actions + Metadata (read-only) across org repos.
          REPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: dearhealth
          REPORT_REPO: ${{ github.repository }}
          STALE_HOURS: ${{ github.event.inputs.stale_hours || '48' }}
        run: |
          python3 scripts/upgrade-main-staleness.py \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
